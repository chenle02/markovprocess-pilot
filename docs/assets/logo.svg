    <line x1="36" y1="192" x2="220" y2="192"/>
  </g>
  <line x1="208" y1="44" x2="208" y2="212" stroke="#c7d2fe" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
