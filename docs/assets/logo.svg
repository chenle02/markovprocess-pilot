      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g stroke="#e0e7ff" stroke-width="6" stroke-linecap="round">
